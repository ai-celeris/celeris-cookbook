# On merge to main, tell the docs site (marqo-ai/diffusion-llm-service) that
# the cookbook advanced. Its "Bump Cookbook Submodule" workflow updates the
# submodule pointer and opens a PR; merging that PR republishes
# docs.celeris.ai/cookbook.
#
# DOCS_BUMP_TOKEN is a fine-grained PAT that can send repository_dispatch to
# marqo-ai/diffusion-llm-service (Contents: read-and-write on that repo).
# Until it is configured this workflow no-ops so main stays green.
name: Notify Docs Site

on:
  push:
    branches:
      - main

jobs:
  dispatch-bump:
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch cookbook-updated to diffusion-llm-service
        env:
          TOKEN: ${{ secrets.DOCS_BUMP_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "DOCS_BUMP_TOKEN secret is not configured; skipping docs notification."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/marqo-ai/diffusion-llm-service/dispatches \
            -d "{\"event_type\":\"cookbook-updated\",\"client_payload\":{\"sha\":\"$SHA\"}}"
          echo "Docs bump dispatched for $SHA."
