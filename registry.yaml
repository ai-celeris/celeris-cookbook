  description: A web chatbot that streams celeris-1 replies and measures time-to-first-token in the browser, a TypeScript server plus vanilla JS UI showcasing Celeris speed and latency.
  date: 2026-07-21
  authors:
    - celeris
  tags:
    - streaming
    - chat-completions
