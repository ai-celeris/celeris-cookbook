# On merge to main, tell the docs site (marqo-ai/diffusion-llm-service) that
# the cookbook advanced. Its "Bump Cookbook Submodule" workflow updates the
# submodule pointer and opens a PR; merging that PR builds the demo assets from
# the pinned sources and republishes docs.celeris.ai/cookbook.
#
# DOCS_BUMP_TOKEN is a fine-grained PAT that can dispatch workflows in
# marqo-ai/diffusion-llm-service (repository access: that repo only;
# permission: Actions: read-and-write). Until it is configured this workflow
# no-ops so main stays green.
name: Notify Docs Site

on:
  push:
    branches:
      - main

jobs:
  dispatch-bump:
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch cookbook_bump workflow in diffusion-llm-service
        env:
          TOKEN: ${{ secrets.DOCS_BUMP_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "DOCS_BUMP_TOKEN secret is not configured; skipping docs notification."
            exit 0
          fi
          STATUS=$(curl -sS -o /tmp/dispatch-response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/marqo-ai/diffusion-llm-service/actions/workflows/cookbook_bump.yaml/dispatches \
            -d '{"ref":"main"}')
          case "$STATUS" in
            204)
              echo "Docs bump workflow dispatched (cookbook at $SHA)." ;;
            404)
              echo "::warning::cookbook_bump.yaml not found on diffusion-llm-service main (integration PR not merged yet?); skipping." ;;
            *)
              echo "Workflow dispatch failed with HTTP $STATUS:"
              cat /tmp/dispatch-response.json
              exit 1 ;;
          esac
