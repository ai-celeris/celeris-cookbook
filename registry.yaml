# yaml-language-server: $schema=./.github/registry_schema.json

# Index of cookbook examples. The website is generated from this file: each
# entry becomes a page rendered from the file at `path` (a Markdown README or
# a Jupyter notebook). See CONTRIBUTING.md for the entry format and rules.

- title: Getting started with the Celeris API
  path: examples/getting-started/getting-started.ipynb
  slug: getting-started
  order: 1
  description: Make your first Celeris chat completion with the OpenAI SDK, with correct max_tokens normalization and input budgeting for the 4096-token window. Includes a streaming cell that times time-to-first-token.
  date: 2026-07-21
  authors:
    - celeris
  tags:
    - getting-started
    - chat-completions
    - token-budgeting
    - streaming

