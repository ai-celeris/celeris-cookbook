# Fly.io app config. Deliberately free of anything secret: the Celeris key is
# stored with `fly secrets set` (encrypted at rest, injected as an env var at
# runtime) and never appears in this file or the image.
app = "celeris-fastapi-example" # change to your own unique app name

[build]
# Uses the Dockerfile in this directory.

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
interval = "30s"
timeout = "5s"
method = "GET"
path = "/healthz"

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
