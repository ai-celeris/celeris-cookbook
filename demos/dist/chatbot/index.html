<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celeris Chatbot</title>
<link rel="stylesheet" href="style.css">
<script>window.__CELERIS_DEMO__ = {"apiBase":"/cookbook-api/","maxBodyBytes":7000,"maxMessages":8};</script>
</head>
<body data-embed>
<header>
  <h1>Celeris Chatbot</h1>
  <p>A streaming chatbot on <code>celeris-1</code>, watch the time-to-first-token.</p>
</header>

<main>
  <div id="notice" class="notice" hidden></div>
  <div id="transcript" aria-live="polite"></div>

  <form id="composer">
    <input id="prompt" type="text" maxlength="1000" placeholder="Ask something&hellip;" autocomplete="off" autofocus>
    <button id="send" type="submit">Send</button>
  </form>
</main>

<script src="app.js"></script>
<script src="embed.js"></script>
</body>
</html>
