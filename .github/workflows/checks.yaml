name: Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate registry and Python examples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install -r scripts/requirements.txt

      - name: Validate registry
        run: python3 scripts/validate.py

      - name: Compile Python examples
        run: python3 -m compileall -q examples

      - name: Import-check FastAPI example (offline)
        run: |
          python3 -m pip install -r examples/fastapi-fly/requirements.txt
          python3 -c "import sys; sys.path.insert(0, 'examples/fastapi-fly'); import main; assert main.app.title"

  typecheck-chatbot:
    name: Typecheck chatbot and demo proxy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and typecheck chatbot
        working-directory: examples/chatbot
        run: |
          npm install
          npm run typecheck

      - name: Install and typecheck demo-proxy
        working-directory: demo-proxy
        run: |
          npm install
          npm run typecheck

  build-nextjs-example:
    name: Build Next.js example
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # next build type-checks and compiles the app; no credentials needed.
      - name: Install and build
        working-directory: examples/nextjs-vercel
        run: |
          npm install
          npm run build
