# On merge to main, trigger the deploy workflow in the private
# ai-celeris/celeris-cookbook-deploy repo via repository_dispatch. That repo
# builds the site and publishes it to S3 + CloudFront with AWS credentials
# this public repo never holds.
#
# DEPLOY_DISPATCH_TOKEN is a fine-grained PAT with Contents: read-and-write
# on celeris-cookbook-deploy (repository_dispatch is a Contents write). Until
# it is configured this workflow no-ops so main stays green.
name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  dispatch-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch deploy to celeris-cookbook-deploy
        env:
          TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "DEPLOY_DISPATCH_TOKEN secret is not configured; skipping deploy."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ai-celeris/celeris-cookbook-deploy/dispatches \
            -d "{\"event_type\":\"deploy-cookbook\",\"client_payload\":{\"sha\":\"$SHA\"}}"
          echo "Deploy dispatched for $SHA."
